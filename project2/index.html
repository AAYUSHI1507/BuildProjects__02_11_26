<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Practice Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <section class="start-screen active">
            <h1>Quiz Practice Test !!</h1>
            <p>Test Your Knowledge with this fun questions</p>
            <button id="start-btn" type="button">Start Quiz</button>
        </section>
        <section class="quizQuestionScreen inactive">
            <div class="quizHead">
                <h2 class="question-text">Question Goes Here</h2>
                <p class="question-number">Question <span>0</span> of <span class="total-questions">3</span></p>
                <p class="score">Score: <span>0</span></p>
            </div>
            <div id="answerOptions" class="answerOptions"></div>
        </section>
        <section class="results-screen inactive">
            <h2>Quiz completed!</h2>
            <p class="results-score">Your score: <span>0</span></p>
            <button id="restart-btn" type="button">Try Again</button>
        </section>
    </main>
    <script>
        const btn = document.getElementById("start-btn");
        const restartBtn = document.getElementById("restart-btn");
        const startScreen = document.querySelector(".start-screen");
        const quizQuestionScreen = document.querySelector(".quizQuestionScreen");
        const resultsScreen = document.querySelector(".results-screen");
        const questionText = document.querySelector(".question-text");
        const answerOptions = document.getElementById("answerOptions");
        const questionNumber = document.querySelector(".question-number span");
        const scoreElement = document.querySelector(".score span");
        const totalQuestionsElement = document.querySelector(".total-questions");
        const resultsScoreElement = document.querySelector(".results-score span");

        const questions = [
            {
                question: "What is the capital of France?",
                options: ["Berlin", "Madrid", "Paris", "Rome"],
                answer: "Paris"
            },
            {
                question: "What is 2 + 2?",
                options: ["3", "4", "5", "6"],
                answer: "4"
            },
            {
                question: "What is the largest planet in our solar system?",
                options: ["Earth", "Jupiter", "Mars", "Saturn"],
                answer: "Jupiter"
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        function setActiveScreen(screen) {
            [startScreen, quizQuestionScreen, resultsScreen].forEach((item) => {
                item.classList.toggle("active", item === screen);
                item.classList.toggle("inactive", item !== screen);
            });
        }

        function showQuestion() {
            const currentQuestion = questions[currentQuestionIndex];
            questionText.textContent = currentQuestion.question;
            questionNumber.textContent = currentQuestionIndex + 1;
            totalQuestionsElement.textContent = questions.length;
            answerOptions.replaceChildren();

            currentQuestion.options.forEach((option) => {
                const optionElement = document.createElement("button");
                optionElement.type = "button";
                optionElement.classList.add("option");
                optionElement.textContent = option;
                optionElement.addEventListener("click", () => {
                    const optionButtons = answerOptions.querySelectorAll(".option");
                    optionButtons.forEach((button) => {
                        button.disabled = true;
                    });

                    const isCorrect = option === currentQuestion.answer;
                    optionElement.classList.add(isCorrect ? "success" : "error");
                    if (isCorrect) {
                        score++;
                        scoreElement.textContent = score;
                    } else {
                        optionButtons.forEach((button) => {
                            if (button.textContent === currentQuestion.answer) {
                                button.classList.add("success");
                            }
                        });
                    }

                    window.setTimeout(() => {
                        currentQuestionIndex++;
                        if (currentQuestionIndex < questions.length) {
                            showQuestion();
                        } else {
                            showResults();
                        }
                    }, 700);
                });
                answerOptions.appendChild(optionElement);
            });
        }

        function showResults() {
            resultsScoreElement.textContent = `${score} / ${questions.length}`;
            answerOptions.replaceChildren();
            setActiveScreen(resultsScreen);
        }

        btn.addEventListener("click", () => {
            setActiveScreen(quizQuestionScreen);
            showQuestion();
        });

        restartBtn.addEventListener("click", () => {
            currentQuestionIndex = 0;
            score = 0;
            scoreElement.textContent = score;
            setActiveScreen(quizQuestionScreen);
            showQuestion();
        });
    </script>
</body>
</html>
