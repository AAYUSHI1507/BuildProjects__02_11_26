<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link
        href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Expense Tracker</h1>
        <div class="balance-container">
            <h3>Your Balance</h3>
            <h2 id="balance-amount">$ 0.00</h2>
            <div class="summary">
                <div class="income">
                    <h3>Income</h3>
                    <p id="income-amount">$ 433</p>
                </div>
                <div class="expense">
                    <h3>Expense</h3>
                    <p id="expense-amount">$ 334</p>
                </div>
            </div>
        </div>
        <div class="main-content">
            <div class="transaction-Container">
                <h2>Transactions</h2>
                <ul id="transaction-list">
                    <!-- List of transactions are added here Must be added through js -->
                    <li>
                        <div class="transaction-item">
                            <span>Description</span>
                            <span> amount</span>
                            <span><i class="fa-solid fa-xmark"></i></span>
                        </div>
                    </li>
                </ul>
            </div>
            <div class="transaction-Form-container">
                <h2>Add Transaction</h2>
                <form id="transactionForm">

                    <div class="form-group">
                        <label for="Description_trans">Description </label>
                        <input type="text" name="Description_trans" id="trans_Desc" placeholder="Enter Description..."
                            required>
                    </div>
                    <div class="form-group">
                        <label for="transaction_amount">Amount </label>
                        <input type="number" name="transaction_amount" id="trans_amount" placeholder="Enter Amount..."
                            required>
                        <small>Use negetive (-) for expenses</small>

                    </div>


                    <button type="submit">Add Transaction</button>

                </form>
            </div>
        </div>
    </div>
</body>

</html>
