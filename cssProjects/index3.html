<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .gallary {
            background-color: rgb(222, 238, 205);
            padding: 10px;
            display: grid;
            grid-template-columns:repeat(auto-fit, minmax(220px,1fr));

            /* three equal columns */
            gap: 16px;
            
        }

        .item {
            padding: 20px;
            background-color: rgb(143, 215, 191);
            align-content:center ;
        }

        .gallary .featured-Item{
            grid-column: span 2;
        }
    </style>
</head>

<body>
    <div class="gallary">
        <div class="item">Item 1</div>
        <div class="item featured-Item">Item 2</div>
        <div class="item">Item 3</div>
        <div class="item">Item 4</div>
        <div class="item">Item 5</div>
        <div class="item">Item 6</div>
        <div class="item">Item 7</div>
        <div class="item">Item 8</div>
    </div>
</body>

</html>
