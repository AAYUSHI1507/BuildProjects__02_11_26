<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    h2 {
        color: blue;
    }

    .card h2 {
        color: teal;
    }

    .title {
        color: orange;
    }

    p {
        color: black;
    }

    div p {
        color: purple;
    }

    .card p {
        color: gray;
    }

    .text {
        color: green;
    }

    #featured .text {
        color: red;
    }
</style>

<body>
    <div class="card" id="featured">
        <h2 class="title">Hello</h2>
        <p class="text">Body text</p>
        <p>Plain text</p>
    </div>
</body>

</html>
