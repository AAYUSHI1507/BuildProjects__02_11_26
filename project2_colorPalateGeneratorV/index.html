<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palate Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <div class="container">
        <h1>Color Palatte Generator</h1>
        <button id="generate-btn">
            <i class="fas fa-sync-alt "></i>
            Generate Palatte
        </button>
        <div class="palatte-container">

            <!-- Color box 1 -->
             <div class="color-box">
                <div class="color" style="background-color: #e1f5fe;"></div>
                <div class="color-info">
                    <span class="hex-value">#e1f5fe</span>
                    <i class="far fa-copy copy-btn" title="copy to clipboard"></i>
                </div>
             </div>
             <!-- Color box 2 -->
             <div class="color-box">
                <div class="color" style="background-color: #77bfbc;"></div>
                <div class="color-info">
                    <span class="hex-value">#77bfbc</span>
                    <i class="far fa-copy copy-btn" title="copy to clipboard"></i>
                </div>
             </div>
             <!-- Color box 3 -->
             <div class="color-box">
                <div class="color" style="background-color: #265d39;"></div>
                <div class="color-info">
                    <span class="hex-value">#265d39</span>
                    <i class="far fa-copy copy-btn" title="copy to clipboard"></i>
                </div>
             </div>
             <!-- Color box 4 -->
             <div class="color-box">
                <div class="color" style="background-color: #893a56;"></div>
                <div class="color-info">
                    <span class="hex-value">#893a56</span>
                    <i class="far fa-copy copy-btn" title="copy to clipboard"></i>
                </div>
             </div>
             <!-- Color box 5 -->
             <div class="color-box">
                <div class="color" style="background-color: #85893a;"></div>
                <div class="color-info">
                    <span class="hex-value">#85893a</span>
                    <i class="far fa-copy copy-btn" title="copy to clipboard"></i>
                </div>
             </div>
        </div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
